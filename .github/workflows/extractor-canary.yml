# Scheduled dry-runs of the extractor lanes, against live upstream services.
#
# Nothing is downloaded and no cookie or secret is used. A failing lane opens or
# updates one issue titled "upstream-canary: ..."; the next green run closes it.
# Keep the title prefix stable: the run searches for it by title.
#
# The fixtures are the ones recorded in .github/canary/dry_run.py:
#   yt-dlp     - the first YouTube video (jNQXAC9IVRw), maximally stable
#   gallery-dl - a PNG hosted in this repo (directlink extractor)
#   sleeve_*   - public playlist 37i9dQZF1DXcBWIGoYBM5M, Audible ASIN B002V1OF70

name: extractor-canary

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: extractor-canary
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install upstream extractors
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade gallery-dl yt-dlp

      - name: Dry-run upstream yt-dlp
        run: |
          yt-dlp --version
          yt-dlp --simulate --no-warnings --print "%(id)s" \
            "https://www.youtube.com/watch?v=jNQXAC9IVRw" | grep -qx jNQXAC9IVRw

      - name: Dry-run upstream gallery-dl
        run: |
          gallery-dl --version
          gallery-dl --simulate --get-urls \
            "https://raw.githubusercontent.com/Burry071/sleeve/main/fastlane/metadata/android/en-US/images/phoneScreenshots/1.png" \
            | grep -q .

      - name: Dry-run the Sleeve Python lanes
        run: python .github/canary/dry_run.py

      - name: Open or update the upstream-canary issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "upstream-canary"' --json number --jq '.[0].number // empty')
          body=$(printf 'A scheduled dry-run of the extractor lanes failed.\n\nRun: %s\n\nFix or pin the lane named in the failing step. This issue closes itself when a run passes again.\n' "$RUN_URL")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "upstream-canary: extractor dry-run failing" --body "$body"
          fi

      - name: Close the upstream-canary issue when every lane passes
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "upstream-canary"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Every lane passed on $RUN_URL; closing."
          fi
