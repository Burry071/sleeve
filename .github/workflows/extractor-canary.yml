# Scheduled dry-runs of the extractor lanes, against offline invariants and
# live upstream services.
#
# Nothing is downloaded and no cookie or secret is used. All lanes run
# independently through .github/canary/dry_run.py (non-short-circuiting) so a
# single datacenter bot-check never masks Spotify/Audible/gallery-dl/sniff
# regressions. A failing run opens or updates one issue titled
# "upstream-canary: ..."; the next green run closes it.
# Keep the title prefix stable: the workflow searches for it by title.

name: extractor-canary

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: extractor-canary
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install upstream extractors
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp gallery-dl

      - name: Run extractor canary matrix
        id: canary
        timeout-minutes: 5
        run: |
          python .github/canary/dry_run.py \
            --json canary-report.json \
            --summary-md canary-summary.md

      - name: Append canary summary to step summary
        if: always()
        run: |
          if [ -f canary-summary.md ]; then
            cat canary-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Extractor Canary Report (FAIL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "canary-summary.md was not generated before step failure." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload canary report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extractor-canary-report
          path: |
            canary-report.json
            canary-summary.md
          retention-days: 30
          if-no-files-found: warn

      - name: Open or update the upstream-canary issue
        if: failure()
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          immediate_alert="false"
          if [ ! -f canary-report.json ]; then
            immediate_alert="true"
          else
            immediate_alert=$(python - <<'PY'
          import json
          with open("canary-report.json", encoding="utf-8") as fh:
              report = json.load(fh)
          immediate = bool(report.get("immediate_alert")) or any(
              lane.get("status") == "FAIL"
              and lane.get("classification") in ("IMPORT_ERROR", "SCHEMA_BREAK")
              for lane in (report.get("lanes") or [])
          )
          print("true" if immediate else "false")
          PY
          )
          fi

          trigger_reason=""
          if [ "$immediate_alert" = "true" ]; then
            trigger_reason="Immediate alert triggered by IMPORT_ERROR or SCHEMA_BREAK (or missing canary report)."
          else
            prev_conclusion=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow extractor-canary.yml \
              --limit 2 \
              --json conclusion \
              --jq '[.[] | select(.conclusion != null and .conclusion != "")] | .[0].conclusion // ""')
            if [ "$prev_conclusion" != "failure" ]; then
              echo "Skipping issue alert: transient failure (previous completed conclusion='${prev_conclusion:-none}'); requiring 2 consecutive failures."
              exit 0
            fi
            trigger_reason="2 consecutive failing canary runs detected (previous completed conclusion: failure)."
          fi

          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          {
            echo "A scheduled dry-run of the extractor canary failed."
            echo ""
            echo "- **Run:** $RUN_URL"
            echo "- **Trigger:** $trigger_reason"
            echo ""
            if [ -f canary-summary.md ]; then
              cat canary-summary.md
            else
              echo "_No canary-summary.md was produced._"
            fi
            echo ""
            echo "Fix or pin the failing lane(s) above. This issue closes automatically once all blocking lanes pass."
          } > "$body_file"

          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "upstream-canary"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "upstream-canary: extractor dry-run failing" \
              --body-file "$body_file"
          fi

      - name: Close the upstream-canary issue when every blocking lane passes
        if: success()
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "upstream-canary"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "All blocking extractor canary lanes passed on $RUN_URL; closing."
          fi
