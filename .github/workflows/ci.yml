# =============================================================================
# RELEASE SAFETY RULES (mandatory — do not remove)
# =============================================================================
# 1. never delete a published GitHub release or its APK asset as part of routine development;
# 2. never reuse a published version name or version code;
# 3. every new release's version code must be greater than every previously distributed build, including other channels;
# 4. preserve application ID and signing identity;
# 5. verify final APK exists, non-empty, installs, expected package metadata;
# 6. verify GitHub release asset URL returns success and supports expected download behavior;
# 7. verify Orion Store can discover and fetch the exact new release asset;
# 8. never publish before Orion distribution compatibility has been checked;
# 9. never allow Orion to select a deleted/stale/unavailable release;
# 10. retain the previous working release as a recovery option;
# 11. record version, version code, commit, APK SHA-256, signing certificate fingerprint, asset URL;
# 12. do not claim a release successful until the actual distribution path is verified.
# =============================================================================

name: ci

on:
  push:
    branches: [main, ghost-engine]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleGenericDebug \
            -PnoSplits \
            -PABI_FILTERS="arm64-v8a;x86_64" \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sleeve-debug-apk
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SLEEVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SLEEVE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLEEVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SLEEVE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            cat > keystore.properties <<PROPS
          storeFile=keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          else
            echo "No signing secrets present - building unsigned"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (unsigned)
        run: |
          ./gradlew :app:assembleGenericRelease \
            -PnoSplits \
            -PABI_FILTERS="arm64-v8a;x86_64" \
            --stacktrace

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sleeve-release-apk
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/generic/release/*.apk | head -1)
          cp "$apk" Sleeve-generic-release.apk
          gh release create "$GITHUB_REF_NAME" "Sleeve-generic-release.apk"             --title "Sleeve $GITHUB_REF_NAME"             --generate-notes
