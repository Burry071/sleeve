# =============================================================================
# RELEASE SAFETY RULES (mandatory — do not remove)
# =============================================================================
# 1. never delete a published GitHub release or its APK asset as part of routine development;
# 2. never reuse a published version name or version code;
# 3. every new release's version code must be greater than every previously distributed build, including other channels;
# 4. preserve application ID and signing identity;
# 5. verify final APK exists, non-empty, installs, expected package metadata;
# 6. verify GitHub release asset URL returns success and supports expected download behavior;
# 7. verify Orion Store can discover and fetch the exact new release asset;
# 8. never publish before Orion distribution compatibility has been checked;
# 9. never allow Orion to select a deleted/stale/unavailable release;
# 10. retain the previous working release as a recovery option;
# 11. record version, version code, commit, APK SHA-256, signing certificate fingerprint, asset URL;
# 12. do not claim a release successful until the actual distribution path is verified.
# =============================================================================

name: ci

on:
  push:
    branches: [main, ghost-engine]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests for the release scripts (offline)
        run: python -m unittest discover -s scripts -p "test_*.py"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleGenericDebug \
            -PnoSplits \
            -PABI_FILTERS="arm64-v8a;x86_64" \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sleeve-debug-apk
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error

  preflight:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release guard (tag, Version.kt, versionCode, release record)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_guard.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build, preflight]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require signing secrets (an unsigned APK must never be published)
        env:
          KEYSTORE_BASE64: ${{ secrets.SLEEVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SLEEVE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLEEVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SLEEVE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to release: missing signing secret(s):$missing"
            echo "RELEASE.md rule 4: preserve the signing identity. An unsigned APK is never published."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SLEEVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SLEEVE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLEEVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SLEEVE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<PROPS
          storeFile=keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleGenericRelease \
            -PnoSplits \
            -PABI_FILTERS="arm64-v8a;x86_64" \
            --stacktrace

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sleeve-release-apk
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error

      - name: Verify APK identity and write SHA256SUMS
        id: apk
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/generic/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk" || { echo "::error::no release APK was produced"; exit 1; }
          cp "$apk" Sleeve-generic-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          expected_code=$(python scripts/release_guard.py --print-shipped-code --no-split-apks | head -1 | cut -d= -f2)
          expected_cert=$(python scripts/release_guard.py --print-cert)

          "$bt/aapt2" dump badging Sleeve-generic-release.apk > badging.txt
          package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" badging.txt | head -1)
          actual_code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" badging.txt | head -1)

          test "$package" = "com.sleeve.app" || { echo "::error::package '$package' != com.sleeve.app"; exit 1; }
          test "$actual_code" = "$expected_code" || { echo "::error::versionCode $actual_code != expected $expected_code"; exit 1; }

          "$bt/apksigner" verify --print-certs Sleeve-generic-release.apk > certs.txt
          grep -qi "$expected_cert" certs.txt || { echo "::error::signer certificate does not match the recorded identity"; exit 1; }

          sha=$(sha256sum Sleeve-generic-release.apk | awk '{print $1}')
          size=$(stat -c%s Sleeve-generic-release.apk)
          echo "$sha  Sleeve-generic-release.apk" > SHA256SUMS
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "verified package=$package versionCode=$actual_code size=$size sha256=$sha"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Beta tags stay non-prerelease on purpose: /releases/latest serves
          # the direct APK link printed in the README.
          gh release create "$GITHUB_REF_NAME" \
            Sleeve-generic-release.apk \
            SHA256SUMS \
            --title "Sleeve $GITHUB_REF_NAME" \
            --generate-notes

      - name: Download the published asset and compare SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_SHA: ${{ steps.apk.outputs.sha256 }}
          LOCAL_SIZE: ${{ steps.apk.outputs.size }}
        run: |
          set -euo pipefail
          mkdir -p published
          fetched=no
          for attempt in $(seq 1 10); do
            if gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --pattern Sleeve-generic-release.apk --dir published --clobber; then
              fetched=yes
              break
            fi
            echo "published asset not downloadable yet (attempt $attempt/10); retrying in 6s"
            sleep 6
          done
          if [ "$fetched" != yes ]; then
            echo "::error::published APK could not be downloaded from the release"
            exit 1
          fi
          published_sha=$(sha256sum published/Sleeve-generic-release.apk | awk '{print $1}')
          published_size=$(stat -c%s published/Sleeve-generic-release.apk)
          if [ "$published_sha" != "$LOCAL_SHA" ] || [ "$published_size" != "$LOCAL_SIZE" ]; then
            echo "::error::published asset differs: sha256=$published_sha size=$published_size (built: $LOCAL_SHA / $LOCAL_SIZE)"
            exit 1
          fi
          echo "published asset is byte-identical to the built APK (sha256:$LOCAL_SHA)"

      - name: Verify the release URL and Orion mirror (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if python scripts/verify_release.py --channel beta --limit 30 \
                 --expect-tag "$GITHUB_REF_NAME" --json > verify.json; then
              cat verify.json
              exit 0
            fi
            echo "verifier not green yet (attempt $attempt/10); retrying in 10s"
            sleep 10
          done
          cat verify.json
          exit 1
