# =============================================================================
# RELEASE SAFETY RULES (mandatory — do not remove)
# =============================================================================
# 1. never delete a published GitHub release or its APK asset as part of routine development;
# 2. never reuse a published version name or version code;
# 3. every new release's version code must be greater than every previously distributed build, including other channels;
# 4. preserve application ID and signing identity;
# 5. verify final APK exists, non-empty, installs, expected package metadata;
# 6. verify GitHub release asset URL returns success and supports expected download behavior;
# 7. verify Orion Store can discover and fetch the exact new release asset;
# 8. never publish before Orion distribution compatibility has been checked;
# 9. never allow Orion to select a deleted/stale/unavailable release;
# 10. retain the previous working release as a recovery option;
# 11. record version, version code, commit, every published artifact's APK SHA-256, signing certificate fingerprint, asset URL;
# 12. do not claim a release successful until the actual distribution path is verified.
# =============================================================================

name: ci

on:
  push:
    branches: [main, ghost-engine]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests for the release scripts (offline)
        run: python -m unittest discover -s scripts -p "test_*.py"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleGenericDebug \
            -PnoSplits \
            -PABI_FILTERS="arm64-v8a;x86_64" \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sleeve-debug-apk
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error

  preflight:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release guard (tag, Version.kt, versionCode, release record)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_guard.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build, preflight]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require signing secrets (an unsigned APK must never be published)
        env:
          KEYSTORE_BASE64: ${{ secrets.SLEEVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SLEEVE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLEEVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SLEEVE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to release: missing signing secret(s):$missing"
            echo "RELEASE.md rule 4: preserve the signing identity. An unsigned APK is never published."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SLEEVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SLEEVE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SLEEVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SLEEVE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          cat > keystore.properties <<PROPS
          storeFile=keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the three signed release APKs
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          build() {
            local abi_filters="$1" target="$2"
            rm -rf app/build/outputs/apk/generic/release
            ./gradlew :app:assembleGenericRelease \
              -PnoSplits \
              -PABI_FILTERS="$abi_filters" \
              --stacktrace
            local apk
            apk=$(find app/build/outputs/apk/generic/release -maxdepth 1 -name '*.apk' -print -quit)
            test -n "$apk" || { echo "::error::no release APK was produced for $abi_filters"; exit 1; }
            cp "$apk" "dist/$target"
          }
          build "arm64-v8a" Sleeve-arm64-release.apk
          build "x86_64" Sleeve-x86_64-release.apk
          build "arm64-v8a;x86_64" Sleeve-generic-release.apk
          ls -l dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sleeve-release-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Verify APK identity, one shared versionCode, and monotonicity
        id: apk
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          expected_code=$(python scripts/release_guard.py --print-base-code)
          previous_code=$(python scripts/release_guard.py --print-previous-code)
          expected_cert=$(python scripts/release_guard.py --print-cert)
          expected_name="${GITHUB_REF_NAME#v}"

          python scripts/apk_gate.py \
            --aapt2 "$bt/aapt2" \
            --expect-package com.sleeve.app \
            --expect-version-name "$expected_name" \
            --expect-code "$expected_code" \
            --previous-code "$previous_code" \
            --require-name Sleeve-arm64-release.apk \
            --require-name Sleeve-x86_64-release.apk \
            --require-name Sleeve-generic-release.apk \
            dist/*.apk

          for apk in dist/*.apk; do
            "$bt/apksigner" verify --print-certs "$apk" > certs.txt
            grep -qi "$expected_cert" certs.txt \
              || { echo "::error::$apk signer certificate does not match the recorded identity"; exit 1; }
          done

          ( cd dist && sha256sum *.apk > SHA256SUMS )
          cat dist/SHA256SUMS
          echo "verified: 3 artifacts, package=com.sleeve.app versionName=$expected_name versionCode=$expected_code (previous $previous_code)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Beta tags stay non-prerelease on purpose: /releases/latest serves
          # the direct APK link printed in the README.
          cat > release-notes.md <<'NOTES'
          ## Which APK do I download?

          - **Most phones (arm64-v8a)** — `Sleeve-arm64-release.apk`, the default download.
          - **x86_64 devices and emulators** — `Sleeve-x86_64-release.apk`.
          - **Works on both** — `Sleeve-generic-release.apk` (arm64-v8a + x86_64, larger).

          All three carry the same versionCode and the same signing certificate
          (`CN=Sleeve, O=Burry071`), so switching between them is never an Android
          "downgrade" and updates keep working. Check any file against `SHA256SUMS`
          with `sha256sum -c SHA256SUMS`.

          ## Known issues

          - Restoring the queue after the app is killed and relaunched brings the
            tasks back but does not continue them — press Resume on the task.

          ## Metered networks, as measured

          Tested on Wi-Fi marked metered: the "Allow downloading with cellular?"
          prompt appears before any transfer, and no media bytes move until you
          allow it. The track list itself is fetched before the prompt so the
          sheet can show the book and its duration.
          NOTES
          cd dist
          gh release create "$GITHUB_REF_NAME" \
            Sleeve-arm64-release.apk \
            Sleeve-x86_64-release.apk \
            Sleeve-generic-release.apk \
            SHA256SUMS \
            --title "Sleeve $GITHUB_REF_NAME" \
            --notes "$(cat ../release-notes.md)" \
            --generate-notes

      - name: Download the published assets and compare SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          fetched=no
          for attempt in $(seq 1 10); do
            if gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --pattern 'Sleeve-*-release.apk' --dir published --clobber; then
              fetched=yes
              break
            fi
            echo "published assets not downloadable yet (attempt $attempt/10); retrying in 6s"
            sleep 6
          done
          if [ "$fetched" != yes ]; then
            echo "::error::published APKs could not be downloaded from the release"
            exit 1
          fi
          count=$(find published -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$count" != 3 ]; then
            echo "::error::expected 3 published APKs, found $count"
            ls -l published
            exit 1
          fi
          cp dist/SHA256SUMS published/SHA256SUMS
          ( cd published && sha256sum -c --strict SHA256SUMS )
          echo "all 3 published APKs are byte-identical to the built artifacts"

      - name: Verify each asset URL and the Orion mirror (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for abi in "" "arm64-v8a" "x86_64"; do
            label="${abi:-universal}"
            args=(--channel beta --limit 30 --expect-tag "$GITHUB_REF_NAME" --json)
            if [ -n "$abi" ]; then args+=(--abi "$abi"); fi
            for attempt in $(seq 1 10); do
              if python scripts/verify_release.py "${args[@]}" > "verify-$label.json"; then
                cat "verify-$label.json"
                break
              fi
              if [ "$attempt" = 10 ]; then
                cat "verify-$label.json"
                echo "::error::$label asset verification did not go green"
                exit 1
              fi
              echo "verifier ($label) not green yet (attempt $attempt/10); retrying in 10s"
              sleep 10
            done
          done
