name: ci

on:
  push:
    branches: [main, ghost-engine]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleGenericDebug \
            -PnoSplits \
            -PABI_FILTERS="arm64-v8a;x86_64" \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sleeve-debug-apk
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (unsigned)
        run: |
          ./gradlew :app:assembleGenericRelease \
            -PnoSplits \
            -PABI_FILTERS="arm64-v8a;x86_64" \
            --stacktrace

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sleeve-release-apk
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
